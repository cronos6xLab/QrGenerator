<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Qr AMG</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Code Styling Library -->
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <style>
        body {
            background-color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            position: relative;
            padding-bottom: 80px;
        }
        .header-green {
            background-color: #2c7a46;
        }
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease;
        }
        .accordion-content.open {
            max-height: 1000px;
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
        .shape-btn {
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .shape-btn:hover { border-color: #9ca3af; }
        .shape-btn.active { border-color: #3b82f6; background-color: #eff6ff; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Estilo para los inputs de color personalizados */
        .color-input-group {
            display: flex;
            align-items: center;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            overflow: hidden;
            height: 48px;
        }
        .color-input-group input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 50px;
            height: 100%;
            cursor: pointer;
            padding: 0;
            background: transparent;
        }
        .color-input-group input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        .color-input-group input[type="color"]::-webkit-color-swatch {
            border: none;
            border-right: 1px solid #e5e7eb;
        }
        .color-input-group input[type="text"] {
            border: none;
            outline: none;
            padding: 0 12px;
            width: 100%;
            height: 100%;
            text-transform: uppercase;
            font-size: 15px;
            color: #374151;
        }
        /* Estilo para los radio buttons y checkboxes */
        .custom-radio, .custom-checkbox {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #9ca3af;
            border-radius: 50%;
            outline: none;
            cursor: pointer;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .custom-checkbox { border-radius: 4px; }
        .custom-radio:checked, .custom-checkbox:checked {
            border-color: #3b82f6;
            background-color: #3b82f6;
        }
        .custom-radio:checked::after {
            content: '';
            width: 8px;
            height: 8px;
            background-color: white;
            border-radius: 50%;
        }
        .custom-checkbox:checked::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
            line-height: 1;
        }
    </style>
</head>
<body>

<div class="app-container" id="app">
    <!-- Cabecera con Pestañas -->
    <div class="header-green text-white pt-4 pb-2 sticky top-0 z-50 shadow-md">
        <div class="px-4 mb-2">
            <h1 class="text-xl font-bold tracking-wider">Generador de Qr AMG</h1>
        </div>
        <div class="flex overflow-x-auto no-scrollbar gap-6 px-4 pb-2 text-sm font-semibold tracking-wide">
            <button class="tab-btn text-white border-b-2 border-white pb-1" data-tab="url">URL</button>
            <button class="tab-btn text-green-200 hover:text-white transition pb-1" data-tab="texto">TEXTO</button>
            <button class="tab-btn text-green-200 hover:text-white transition pb-1" data-tab="email">EMAIL</button>
            <button class="tab-btn text-green-200 hover:text-white transition pb-1" data-tab="telefono">TELÉFONO</button>
            <button class="tab-btn text-green-200 hover:text-white transition pb-1" data-tab="sms">SMS</button>
            <button class="tab-btn text-green-200 hover:text-white transition pb-1" data-tab="vcard">VCARD</button>
        </div>
    </div>

    <!-- Área de Previsualización -->
    <div class="p-4 bg-gray-50 border-b border-gray-200 flex flex-col items-center justify-center sticky top-[76px] z-40 shadow-sm">
        <div id="qr-preview" class="bg-white p-2 rounded-xl shadow-sm border border-gray-100"></div>
        <p class="text-xs text-gray-400 mt-2">Vista previa en tiempo real</p>
    </div>

    <div class="p-4 space-y-3">
        <!-- Acordeón 1: Introducir Contenido -->
        <div class="bg-white rounded-lg border border-gray-200 overflow-hidden shadow-sm">
            <button class="accordion-header w-full flex items-center justify-between p-4 bg-white hover:bg-gray-50 transition" data-target="content-1">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded bg-gray-100 flex items-center justify-center text-gray-600">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                    </div>
                    <span class="font-medium text-gray-700 uppercase">Introduce Contenido</span>
                </div>
                <svg class="w-5 h-5 text-gray-400 transform transition-transform accordion-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
            </button>
            <div id="content-1" class="accordion-content px-4 bg-gray-50 border-t border-gray-100">
                <label class="block text-sm font-semibold text-gray-600 mb-1" id="input-label">Tu URL</label>
                <input type="text" id="qr-data" value="https://www.qrcode-monkey.com" class="w-full p-3 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="https://ejemplo.com">
            </div>
        </div>

        <!-- Acordeón 2: Escoge Colores (ACTUALIZADO) -->
        <div class="bg-white rounded-lg border border-gray-200 overflow-hidden shadow-sm">
            <button class="accordion-header w-full flex items-center justify-between p-4 bg-white hover:bg-gray-50 transition" data-target="content-2">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded bg-blue-100 flex items-center justify-center text-blue-600">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path></svg>
                    </div>
                    <span class="font-medium text-gray-700 uppercase">Escoge Colores</span>
                </div>
                <svg class="w-5 h-5 text-gray-400 transform transition-transform accordion-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
            </button>
            <div id="content-2" class="accordion-content px-4 bg-gray-50 border-t border-gray-100">
                <div class="space-y-5">
                    
                    <!-- Color de Frente -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-3">Color de Frente</label>
                        
                        <!-- Opciones de tipo de color -->
                        <div class="flex flex-wrap gap-4 items-center mb-3 text-sm text-gray-600">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="radio" name="color-type" value="solid" class="custom-radio" checked>
                                Un solo Color
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="radio" name="color-type" value="gradient" class="custom-radio">
                                Color Desvanecido
                            </label>
                        </div>
                        
                        <!-- Checkbox Ojo Personalizado -->
                        <label class="flex items-center gap-2 cursor-pointer text-sm text-gray-600 mb-4">
                            <input type="checkbox" id="custom-eye-check" class="custom-checkbox">
                            Color de Ojo Personalizado
                        </label>

                        <!-- Inputs de color -->
                        <div class="space-y-3">
                            <div class="color-input-group">
                                <input type="color" id="color-front-1" value="#000000">
                                <input type="text" id="hex-front-1" value="#000000" maxlength="7">
                            </div>
                            
                            <!-- Segundo color para degradado (Oculto por defecto) -->
                            <div id="gradient-color-container" class="color-input-group hidden mt-3">
                                <input type="color" id="color-front-2" value="#3b82f6">
                                <input type="text" id="hex-front-2" value="#3B82F6" maxlength="7">
                            </div>

                            <!-- Color de ojo (Oculto por defecto) -->
                            <div id="eye-color-container" class="color-input-group hidden mt-3">
                                <input type="color" id="color-eye" value="#000000">
                                <input type="text" id="hex-eye" value="#000000" maxlength="7">
                            </div>
                        </div>
                    </div>

                    <!-- Color de Fondo -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-2">Color de fondo</label>
                        <div class="color-input-group">
                            <input type="color" id="color-bg" value="#ffffff">
                            <input type="text" id="hex-bg" value="#FFFFFF" maxlength="7">
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- Acordeón 3: Añadir Imagen del Logo -->
        <div class="bg-white rounded-lg border border-gray-200 overflow-hidden shadow-sm">
            <button class="accordion-header w-full flex items-center justify-between p-4 bg-white hover:bg-gray-50 transition" data-target="content-3">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded bg-gray-100 flex items-center justify-center text-gray-600">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    </div>
                    <span class="font-medium text-gray-700 uppercase">Añadir Imagen del Logo</span>
                </div>
                <svg class="w-5 h-5 text-gray-400 transform transition-transform accordion-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
            </button>
            <div id="content-3" class="accordion-content px-4 bg-gray-50 border-t border-gray-100">
                <div class="flex items-center gap-4">
                    <div class="w-24 h-24 bg-white border-2 border-dashed border-gray-300 rounded flex items-center justify-center text-xs text-gray-400" id="logo-preview">
                        SIN LOGO
                    </div>
                    <div>
                        <input type="file" id="logo-upload" accept="image/*" class="hidden">
                        <button onclick="document.getElementById('logo-upload').click()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded text-sm font-medium transition shadow-sm">
                            Usa Imagen
                        </button>
                        <button id="remove-logo" class="mt-2 text-xs text-red-500 hover:text-red-700 block underline hidden">Eliminar Logo</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Acordeón 4: Personalizar Diseño -->
        <div class="bg-white rounded-lg border border-gray-200 overflow-hidden shadow-sm">
            <button class="accordion-header w-full flex items-center justify-between p-4 bg-white hover:bg-gray-50 transition" data-target="content-4">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded bg-gray-100 flex items-center justify-center text-gray-600">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    </div>
                    <span class="font-medium text-gray-700 uppercase">Personalizar Diseño</span>
                </div>
                <svg class="w-5 h-5 text-gray-400 transform transition-transform accordion-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
            </button>
            <div id="content-4" class="accordion-content px-4 bg-gray-50 border-t border-gray-100">
                
                <label class="block text-sm font-semibold text-gray-600 mb-2">Forma del cuerpo</label>
                <div class="grid grid-cols-4 gap-2 mb-4">
                    <div class="shape-btn active" data-type="dots" data-value="square"><svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="4" height="4"/><rect x="10" y="4" width="4" height="4"/><rect x="16" y="4" width="4" height="4"/><rect x="4" y="10" width="4" height="4"/><rect x="10" y="10" width="4" height="4"/><rect x="16" y="10" width="4" height="4"/><rect x="4" y="16" width="4" height="4"/><rect x="10" y="16" width="4" height="4"/><rect x="16" y="16" width="4" height="4"/></svg></div>
                    <div class="shape-btn" data-type="dots" data-value="dots"><svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="6" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="12" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg></div>
                    <div class="shape-btn" data-type="dots" data-value="rounded"><svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="6" height="6" rx="2"/><rect x="14" y="4" width="6" height="6" rx="2"/><rect x="4" y="14" width="6" height="6" rx="2"/><rect x="14" y="14" width="6" height="6" rx="2"/></svg></div>
                    <div class="shape-btn" data-type="dots" data-value="classy"><svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></div>
                </div>

                <label class="block text-sm font-semibold text-gray-600 mb-2">Forma del marco del ojo</label>
                <div class="grid grid-cols-4 gap-2 mb-4">
                    <div class="shape-btn active" data-type="cornersSquareOptions" data-value="square"><div class="w-6 h-6 border-4 border-black"></div></div>
                    <div class="shape-btn" data-type="cornersSquareOptions" data-value="extra-rounded"><div class="w-6 h-6 border-4 border-black rounded-lg"></div></div>
                    <div class="shape-btn" data-type="cornersSquareOptions" data-value="dot"><div class="w-6 h-6 border-4 border-black rounded-full"></div></div>
                </div>

                <label class="block text-sm font-semibold text-gray-600 mb-2">Forma del ojo</label>
                <div class="grid grid-cols-4 gap-2 mb-4">
                    <div class="shape-btn active" data-type="cornersDotOptions" data-value="square"><div class="w-4 h-4 bg-black"></div></div>
                    <div class="shape-btn" data-type="cornersDotOptions" data-value="dot"><div class="w-4 h-4 bg-black rounded-full"></div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Botones de Descarga -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 max-w-[480px] mx-auto z-50 flex gap-2">
        <button id="download-png" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded shadow-md transition">Descarga PNG</button>
        <button id="download-svg" class="flex-1 bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold py-3 px-4 rounded shadow-sm border border-blue-200 transition">Descarga SVG</button>
    </div>

</div>

<script>
    // Configuración inicial del QR
    let qrConfig = {
        width: 250,
        height: 250,
        type: "svg",
        data: "https://www.qrcode-monkey.com",
        image: "",
        margin: 10,
        qrOptions: { typeNumber: 0, mode: "Byte", errorCorrectionLevel: "Q" },
        imageOptions: { hideBackgroundDots: true, imageSize: 0.4, margin: 5, crossOrigin: "anonymous" },
        dotsOptions: { color: "#000000", type: "square" },
        backgroundOptions: { color: "#ffffff" },
        cornersSquareOptions: { color: "#000000", type: "square" },
        cornersDotOptions: { color: "#000000", type: "square" }
    };

    const qrCode = new QRCodeStyling(qrConfig);
    const previewContainer = document.getElementById('qr-preview');
    qrCode.append(previewContainer);

    function updateQR() { qrCode.update(qrConfig); }

    // --- Lógica de Acordeones ---
    document.querySelectorAll('.accordion-header').forEach(button => {
        button.addEventListener('click', () => {
            const targetId = button.getAttribute('data-target');
            const content = document.getElementById(targetId);
            const icon = button.querySelector('.accordion-icon');
            
            document.querySelectorAll('.accordion-content').forEach(el => {
                if (el.id !== targetId) {
                    el.classList.remove('open');
                    el.previousElementSibling.querySelector('.accordion-icon').style.transform = 'rotate(0deg)';
                }
            });

            content.classList.toggle('open');
            icon.style.transform = content.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
        });
    });

    // --- Lógica de Entrada de Datos ---
    document.getElementById('qr-data').addEventListener('input', (e) => {
        qrConfig.data = e.target.value || " ";
        updateQR();
    });

    // --- Lógica de Colores y Gama Cromática ---
    const colorTypeRadios = document.querySelectorAll('input[name="color-type"]');
    const customEyeCheck = document.getElementById('custom-eye-check');
    const gradientContainer = document.getElementById('gradient-color-container');
    const eyeColorContainer = document.getElementById('eye-color-container');
    
    // Inputs de frente
    const colorFront1 = document.getElementById('color-front-1');
    const hexFront1 = document.getElementById('hex-front-1');
    const colorFront2 = document.getElementById('color-front-2');
    const hexFront2 = document.getElementById('hex-front-2');
    
    // Inputs de ojo
    const colorEye = document.getElementById('color-eye');
    const hexEye = document.getElementById('hex-eye');

    // Inputs de fondo
    const colorBg = document.getElementById('color-bg');
    const hexBg = document.getElementById('hex-bg');

    // Función para sincronizar Color Picker y Texto Hex
    function syncColorInputs(colorInput, textInput, callback) {
        colorInput.addEventListener('input', (e) => {
            textInput.value = e.target.value.toUpperCase();
            callback();
        });
        textInput.addEventListener('input', (e) => {
            let val = e.target.value;
            if(val.startsWith('#') && (val.length === 4 || val.length === 7)) {
                colorInput.value = val;
                callback();
            }
        });
    }

    // Función principal para aplicar los colores al QR
    function applyColors() {
        const isGradient = document.querySelector('input[name="color-type"]:checked').value === 'gradient';
        const hasCustomEye = customEyeCheck.checked;
        const color1 = colorFront1.value;
        const color2 = colorFront2.value;
        const bgColor = colorBg.value;
        const eyeColorVal = colorEye.value;

        // Configurar Fondo
        qrConfig.backgroundOptions.color = bgColor;

        // Configurar Frente (Sólido o Degradado)
        if (isGradient) {
            qrConfig.dotsOptions.color = color1; // Fallback
            qrConfig.dotsOptions.gradient = {
                type: 'linear',
                rotation: Math.PI / 4,
                colorStops: [
                    { offset: 0, color: color1 },
                    { offset: 1, color: color2 }
                ]
            };
        } else {
            delete qrConfig.dotsOptions.gradient;
            qrConfig.dotsOptions.color = color1;
        }

        // Configurar Ojos (Marcos y Centros)
        if (hasCustomEye) {
            qrConfig.cornersSquareOptions.color = eyeColorVal;
            qrConfig.cornersDotOptions.color = eyeColorVal;
        } else {
            // Si no es personalizado, heredan el color del frente (o el primer color del degradado)
            qrConfig.cornersSquareOptions.color = color1;
            qrConfig.cornersDotOptions.color = color1;
        }

        updateQR();
    }

    // Sincronizar todos los inputs
    syncColorInputs(colorFront1, hexFront1, applyColors);
    syncColorInputs(colorFront2, hexFront2, applyColors);
    syncColorInputs(colorEye, hexEye, applyColors);
    syncColorInputs(colorBg, hexBg, applyColors);

    // Eventos de Radio Buttons (Sólido / Degradado)
    colorTypeRadios.forEach(radio => {
        radio.addEventListener('change', (e) => {
            if (e.target.value === 'gradient') {
                gradientContainer.classList.remove('hidden');
            } else {
                gradientContainer.classList.add('hidden');
            }
            applyColors();
        });
    });

    // Evento Checkbox Ojo Personalizado
    customEyeCheck.addEventListener('change', (e) => {
        if (e.target.checked) {
            eyeColorContainer.classList.remove('hidden');
        } else {
            eyeColorContainer.classList.add('hidden');
        }
        applyColors();
    });

    // --- Lógica de Logo ---
    const logoUpload = document.getElementById('logo-upload');
    const logoPreview = document.getElementById('logo-preview');
    const removeLogoBtn = document.getElementById('remove-logo');

    logoUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                qrConfig.image = event.target.result;
                logoPreview.innerHTML = `<img src="${event.target.result}" class="w-full h-full object-contain rounded">`;
                removeLogoBtn.classList.remove('hidden');
                updateQR();
            };
            reader.readAsDataURL(file);
        }
    });

    removeLogoBtn.addEventListener('click', () => {
        qrConfig.image = "";
        logoPreview.innerHTML = "SIN LOGO";
        logoUpload.value = "";
        removeLogoBtn.classList.add('hidden');
        updateQR();
    });

    // --- Lógica de Formas ---
    document.querySelectorAll('.shape-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const type = btn.getAttribute('data-type');
            const value = btn.getAttribute('data-value');
            
            btn.parentElement.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            qrConfig[type].type = value;
            updateQR();
        });
    });

    // --- Descargas ---
    document.getElementById('download-png').addEventListener('click', () => qrCode.download({ name: "qr-amg", extension: "png" }));
    document.getElementById('download-svg').addEventListener('click', () => qrCode.download({ name: "qr-amg", extension: "svg" }));

    // Iniciar con el segundo acordeón abierto (Colores) para mostrar la nueva función
    document.querySelector('.accordion-header[data-target="content-2"]').click();
</script>
</body>
</html>
