<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Generador de QR AMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <style>
        :root {
            --purple: #9333ea;
            --purple-dark: #7e22ce;
            --purple-light: #f3e8ff;
            --purple-lighter: #faf5ff;
            --gray-pill: #f3f4f6;
            --gray-text: #374151;
        }
        * { -webkit-tap-highlight-color: transparent; }
        body {
            background: linear-gradient(135deg, #e9d5ff 0%, #f3e8ff 40%, #ddd6fe 100%);
            background-attachment: fixed;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1f2937;
            margin: 0;
        }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 14px 12px 100px;
            min-height: 100vh;
        }

        /* ==== PILLS HORIZONTALES (tipos de contenido) ==== */
        .pills-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px;
            background: rgba(255,255,255,0.75);
            border-radius: 18px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(147, 51, 234, 0.08);
            margin-bottom: 14px;
            scroll-behavior: smooth;
        }
        .pills-bar::-webkit-scrollbar { display: none; }
        .pills-bar { -ms-overflow-style: none; scrollbar-width: none; }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 16px;
            border-radius: 13px;
            background: var(--gray-pill);
            color: var(--gray-text);
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            flex-shrink: 0;
            font-family: inherit;
        }
        .pill:active { transform: scale(0.96); }
        .pill svg { width: 20px; height: 20px; flex-shrink: 0; }
        .pill.active {
            background: var(--purple-light);
            color: var(--purple);
        }
        .pill.active svg { color: var(--purple); }

        /* ==== TARJETA PRINCIPAL ==== */
        .main-card {
            background: #ffffff;
            border-radius: 26px;
            padding: 22px 18px;
            box-shadow: 0 8px 30px rgba(147, 51, 234, 0.10);
            margin-bottom: 16px;
        }

        /* ==== STEP TABS (Contenido / Personalizar) ==== */
        .step-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }
        .step-tab {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 12px;
            border-radius: 14px;
            background: var(--gray-pill);
            font-weight: 700;
            font-size: 15px;
            color: var(--gray-text);
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            font-family: inherit;
        }
        .step-tab:active { transform: scale(0.98); }
        .step-tab.active {
            background: var(--purple-light);
            color: var(--purple);
        }
        .step-num {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #374151;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
        }
        .step-tab.active .step-num { background: var(--purple); }

        /* ==== INPUT PRINCIPAL ==== */
        .big-input {
            width: 100%;
            padding: 20px 18px;
            border: 1.5px solid #e5e7eb;
            border-radius: 14px;
            font-size: 16px;
            color: #374151;
            outline: none;
            transition: all 0.2s;
            background: #fff;
            font-family: inherit;
            box-sizing: border-box;
        }
        .big-input::placeholder { color: #9ca3af; }
        .big-input:focus {
            border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.10);
        }
        .input-help {
            font-size: 12px;
            color: #9ca3af;
            margin: 8px 4px 0;
            line-height: 1.4;
        }

        /* ==== PREVIEW QR ==== */
        .qr-preview-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px 0 20px;
            min-height: 240px;
        }
        #qr-preview {
            background: white;
            padding: 6px;
            border-radius: 16px;
            display: inline-block;
        }

        /* ==== SECCIONES DE PERSONALIZACIÓN ==== */
        .custom-section {
            padding: 16px 0;
            border-bottom: 1px solid #f3f4f6;
        }
        .custom-section:last-child { border-bottom: none; padding-bottom: 4px; }
        .custom-section:first-child { padding-top: 4px; }
        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::before {
            content: '';
            width: 3px;
            height: 14px;
            background: var(--purple);
            border-radius: 2px;
        }

        /* ==== COLOR INPUT ==== */
        .color-input-group {
            display: flex;
            align-items: center;
            background: #fff;
            border: 1.5px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            height: 46px;
            transition: border-color 0.2s;
        }
        .color-input-group:focus-within { border-color: var(--purple); }
        .color-input-group input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 46px;
            height: 100%;
            cursor: pointer;
            padding: 0;
            background: transparent;
        }
        .color-input-group input[type="color"]::-webkit-color-swatch-wrapper { padding: 4px; }
        .color-input-group input[type="color"]::-webkit-color-swatch {
            border: none; border-radius: 8px;
        }
        .color-input-group input[type="text"] {
            border: none; outline: none; padding: 0 14px;
            width: 100%; height: 100%;
            text-transform: uppercase;
            font-size: 14px; color: #374151;
            font-family: 'SF Mono', Menlo, monospace;
            background: transparent;
            letter-spacing: 0.5px;
        }

        /* ==== RADIO / CHECKBOX ==== */
        .custom-radio, .custom-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 20px; height: 20px;
            border: 2px solid #d1d5db;
            border-radius: 50%;
            outline: none; cursor: pointer;
            position: relative;
            display: inline-flex;
            align-items: center; justify-content: center;
            transition: all 0.2s; flex-shrink: 0;
            margin: 0;
        }
        .custom-checkbox { border-radius: 6px; }
        .custom-radio:checked, .custom-checkbox:checked {
            border-color: var(--purple);
            background-color: var(--purple);
        }
        .custom-radio:checked::after {
            content: ''; width: 8px; height: 8px;
            background-color: white; border-radius: 50%;
        }
        .custom-checkbox:checked::after {
            content: '✓'; color: white; font-size: 13px;
            font-weight: bold; line-height: 1;
        }

        /* ==== SHAPE BTNS ==== */
        .shape-btn {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 10px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            background: #fff;
            color: #374151;
        }
        .shape-btn:active { transform: scale(0.96); }
        .shape-btn:hover { border-color: #d1d5db; }
        .shape-btn.active {
            border-color: var(--purple);
            background-color: var(--purple-lighter);
            color: var(--purple);
        }
        .shape-btn span {
            font-size: 10px;
            color: #6b7280;
            font-weight: 500;
        }
        .shape-btn.active span { color: var(--purple); font-weight: 700; }

        /* ==== RANGE ==== */
        input[type="range"] {
            -webkit-appearance: none; appearance: none;
            width: 100%;
            background: #e5e7eb; height: 6px;
            border-radius: 4px; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 22px; height: 22px;
            background: var(--purple); border-radius: 50%;
            cursor: pointer; border: 3px solid white;
            box-shadow: 0 2px 6px rgba(147, 51, 234, 0.35);
        }
        input[type="range"]::-moz-range-thumb {
            width: 22px; height: 22px;
            background: var(--purple); border-radius: 50%;
            cursor: pointer; border: 3px solid white;
            box-shadow: 0 2px 6px rgba(147, 51, 234, 0.35);
        }

        /* ==== SELECT ==== */
        .pretty-select {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e5e7eb;
            border-radius: 12px;
            font-size: 14px;
            background: #fff;
            color: #374151;
            outline: none;
            font-family: inherit;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239333ea' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 18px;
            padding-right: 40px;
        }
        .pretty-select:focus { border-color: var(--purple); }

        /* ==== LOGO ==== */
        .logo-preview {
            width: 96px;
            height: 96px;
            background: #fafafa;
            border: 2px dashed #e5e7eb;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #9ca3af;
            overflow: hidden;
            text-align: center;
            flex-shrink: 0;
        }
        .btn-purple {
            background: var(--purple);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-purple:hover { background: var(--purple-dark); }
        .btn-purple:active { transform: scale(0.97); }

        /* ==== BOTONES DESCARGA ==== */
        .download-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            max-width: 480px;
            margin: 0 auto;
            padding: 14px 14px calc(14px + env(safe-area-inset-bottom, 0px));
            display: flex;
            gap: 10px;
            z-index: 50;
            background: linear-gradient(to top, rgba(243,232,255,0.95) 30%, rgba(243,232,255,0));
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .btn-download {
            flex: 1;
            padding: 15px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-download:active { transform: scale(0.97); }
        .btn-primary {
            background: var(--purple);
            color: white;
            box-shadow: 0 4px 14px rgba(147, 51, 234, 0.35);
        }
        .btn-primary:hover { background: var(--purple-dark); }
        .btn-secondary {
            background: white;
            color: var(--purple);
            border: 1.5px solid var(--purple-light);
        }
        .btn-secondary:hover { background: var(--purple-lighter); }

        /* ==== Radio inline labels ==== */
        .radio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #4b5563;
            user-select: none;
        }
        .check-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 14px;
            color: #4b5563;
            user-select: none;
            padding: 4px 0;
        }
        .check-label strong { font-weight: 600; color: #374151; }

        .hidden { display: none !important; }

        .fade-in {
            animation: fadeIn 0.25s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- ==== PILLS HORIZONTALES ==== -->
    <div class="pills-bar" id="pills-bar">
        <button type="button" class="pill active" data-tab="url">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            URL / Enlace
        </button>
        <button type="button" class="pill" data-tab="imagen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            Imagen
        </button>
        <button type="button" class="pill" data-tab="texto">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="15" y2="18"/></svg>
            Texto
        </button>
        <button type="button" class="pill" data-tab="pdf">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
            PDF
        </button>
        <button type="button" class="pill" data-tab="mapa">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            Mapa
        </button>
        <button type="button" class="pill" data-tab="whatsapp">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            WhatsApp
        </button>
        <button type="button" class="pill" data-tab="instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
            Instagram
        </button>
        <button type="button" class="pill" data-tab="youtube">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"/></svg>
            YouTube
        </button>
        <button type="button" class="pill" data-tab="forms">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="12" y2="16"/></svg>
            Formularios
        </button>
        <button type="button" class="pill" data-tab="email">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            Email
        </button>
        <button type="button" class="pill" data-tab="telefono">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0 1 22 16.92z"/></svg>
            Teléfono
        </button>
        <button type="button" class="pill" data-tab="sms">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            SMS
        </button>
        <button type="button" class="pill" data-tab="vcard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M15 8h4M15 12h4M5 16h14a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2z"/></svg>
            vCard
        </button>
    </div>

    <!-- ==== TARJETA PRINCIPAL ==== -->
    <div class="main-card">

        <!-- Preview QR -->
        <div class="qr-preview-wrap">
            <div id="qr-preview"></div>
        </div>

        <!-- Step tabs -->
        <div class="step-tabs">
            <button type="button" class="step-tab active" data-step="content">
                <span class="step-num">1</span>
                Contenido
            </button>
            <button type="button" class="step-tab" data-step="customize">
                <span class="step-num">2</span>
                Personalizar
            </button>
        </div>

        <!-- ==== PANEL: CONTENIDO ==== -->
        <div id="panel-content" class="fade-in">
            <input type="url" id="qr-data" class="big-input" value="https://www.qrcode-monkey.com" placeholder="Pon tu enlace aquí">
            <p class="input-help" id="input-help">Introduce una dirección web completa (incluye https://).</p>
        </div>

        <!-- ==== PANEL: PERSONALIZAR ==== -->
        <div id="panel-customize" class="hidden fade-in">

            <!-- Colores del frente -->
            <div class="custom-section">
                <div class="section-title">Color de Frente</div>
                <div class="flex flex-wrap gap-4 items-center mb-3 text-sm text-gray-600">
                    <label class="radio-label">
                        <input type="radio" name="color-type" value="solid" class="custom-radio" checked>
                        Sólido
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="color-type" value="gradient" class="custom-radio">
                        Desvanecido
                    </label>
                </div>
                <div class="space-y-3">
                    <div class="color-input-group">
                        <input type="color" id="color-front-1" value="#000000">
                        <input type="text" id="hex-front-1" value="#000000" maxlength="7">
                    </div>
                    <div id="gradient-color-container" class="color-input-group hidden">
                        <input type="color" id="color-front-2" value="#3b82f6">
                        <input type="text" id="hex-front-2" value="#3B82F6" maxlength="7">
                    </div>
                </div>
            </div>

            <!-- Ojos -->
            <div class="custom-section">
                <div class="section-title">Ojos (Esquinas)</div>
                <label class="check-label mb-2">
                    <input type="checkbox" id="custom-eye-frame-check" class="custom-checkbox">
                    <strong>Personalizar Marco</strong>
                </label>
                <div id="eye-frame-color-container" class="color-input-group hidden mb-3 mt-2">
                    <input type="color" id="color-eye-frame" value="#ff0000">
                    <input type="text" id="hex-eye-frame" value="#FF0000" maxlength="7">
                </div>
                <label class="check-label mb-2">
                    <input type="checkbox" id="custom-eye-dot-check" class="custom-checkbox">
                    <strong>Personalizar Centro</strong>
                </label>
                <div id="eye-dot-color-container" class="color-input-group hidden mt-2">
                    <input type="color" id="color-eye-dot" value="#00ff00">
                    <input type="text" id="hex-eye-dot" value="#00FF00" maxlength="7">
                </div>
            </div>

            <!-- Fondo -->
            <div class="custom-section">
                <div class="section-title">Fondo</div>
                <label class="check-label mb-2">
                    <input type="checkbox" id="transparent-bg-check" class="custom-checkbox">
                    <strong>Fondo Transparente</strong> <span style="font-size:12px;color:#9ca3af;">(SVG/PNG)</span>
                </label>
                <div id="bg-color-wrapper" class="mt-2">
                    <div class="color-input-group">
                        <input type="color" id="color-bg" value="#ffffff">
                        <input type="text" id="hex-bg" value="#FFFFFF" maxlength="7">
                    </div>
                </div>
            </div>

            <!-- Logo -->
            <div class="custom-section">
                <div class="section-title">Logo Central</div>
                <div class="flex items-center gap-4">
                    <div class="logo-preview" id="logo-preview">
                        SIN LOGO
                    </div>
                    <div class="flex flex-col gap-2">
                        <input type="file" id="logo-upload" accept="image/*" class="hidden">
                        <button type="button" id="upload-btn" class="btn-purple">
                            Usar Imagen
                        </button>
                        <button type="button" id="remove-logo" class="text-xs text-red-500 underline hidden" style="background:none;border:none;cursor:pointer;font-family:inherit;">
                            Eliminar Logo
                        </button>
                    </div>
                </div>
            </div>

            <!-- Forma del cuerpo -->
            <div class="custom-section">
                <div class="section-title">Forma del Cuerpo</div>
                <div class="grid grid-cols-4 gap-2">
                    <div class="shape-btn active" data-type="dotsOptions" data-value="square">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="4" height="4"/><rect x="10" y="4" width="4" height="4"/><rect x="16" y="4" width="4" height="4"/><rect x="4" y="10" width="4" height="4"/><rect x="10" y="10" width="4" height="4"/><rect x="16" y="10" width="4" height="4"/><rect x="4" y="16" width="4" height="4"/><rect x="10" y="16" width="4" height="4"/><rect x="16" y="16" width="4" height="4"/></svg>
                        <span>Cuadrado</span>
                    </div>
                    <div class="shape-btn" data-type="dotsOptions" data-value="dots">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="6" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="12" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>
                        <span>Puntos</span>
                    </div>
                    <div class="shape-btn" data-type="dotsOptions" data-value="rounded">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="6" height="6" rx="2"/><rect x="14" y="4" width="6" height="6" rx="2"/><rect x="4" y="14" width="6" height="6" rx="2"/><rect x="14" y="14" width="6" height="6" rx="2"/></svg>
                        <span>Redondo</span>
                    </div>
                    <div class="shape-btn" data-type="dotsOptions" data-value="classy-rounded">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h8v3H7v5H4zM12 4h8v8h-3V7h-5zM4 12h3v5h5v3H4zM17 12h3v8h-8v-3h5z"/></svg>
                        <span>Elegante</span>
                    </div>
                </div>
            </div>

            <!-- Forma marco del ojo -->
            <div class="custom-section">
                <div class="section-title">Forma del Marco</div>
                <div class="grid grid-cols-3 gap-2">
                    <div class="shape-btn active" data-type="cornersSquareOptions" data-value="square">
                        <div class="w-6 h-6 border-4 border-current"></div>
                        <span>Cuadrado</span>
                    </div>
                    <div class="shape-btn" data-type="cornersSquareOptions" data-value="extra-rounded">
                        <div class="w-6 h-6 border-4 border-current rounded-lg"></div>
                        <span>Redondeado</span>
                    </div>
                    <div class="shape-btn" data-type="cornersSquareOptions" data-value="dot">
                        <div class="w-6 h-6 border-4 border-current rounded-full"></div>
                        <span>Círculo</span>
                    </div>
                </div>
            </div>

            <!-- Forma del ojo centro -->
            <div class="custom-section">
                <div class="section-title">Forma del Centro</div>
                <div class="grid grid-cols-3 gap-2">
                    <div class="shape-btn active" data-type="cornersDotOptions" data-value="square">
                        <div class="w-4 h-4 bg-current"></div>
                        <span>Cuadrado</span>
                    </div>
                    <div class="shape-btn" data-type="cornersDotOptions" data-value="dot">
                        <div class="w-4 h-4 bg-current rounded-full"></div>
                        <span>Círculo</span>
                    </div>
                </div>
            </div>

            <!-- Margen -->
            <div class="custom-section">
                <div class="section-title">Margen (Zona de Seguridad)</div>
                <div class="flex items-center gap-3">
                    <input type="range" id="qr-margin" min="0" max="40" value="10" class="w-full">
                    <span id="margin-value" class="text-sm font-bold w-8 text-right" style="color:var(--purple)">10</span>
                </div>
            </div>

            <!-- Corrección de errores -->
            <div class="custom-section">
                <div class="section-title">Nivel de Corrección</div>
                <select id="error-correction" class="pretty-select">
                    <option value="L">Bajo (7%) — Sin logo</option>
                    <option value="M">Medio (15%)</option>
                    <option value="Q" selected>Alto (25%) — Con logo</option>
                    <option value="H">Máximo (30%)</option>
                </select>
            </div>

        </div>
    </div>

    <!-- ==== BARRA DESCARGA ==== -->
    <div class="download-bar">
        <button type="button" id="download-png" class="btn-download btn-primary">Descargar PNG</button>
        <button type="button" id="download-svg" class="btn-download btn-secondary">Descargar SVG</button>
    </div>

</div>

<script>
/* =============================================================
   CONFIGURACIÓN INICIAL DEL QR
============================================================= */
const qrConfig = {
    width: 220,
    height: 220,
    type: "svg",
    data: "https://www.qrcode-monkey.com",
    image: "",
    margin: 10,
    qrOptions: { typeNumber: 0, mode: "Byte", errorCorrectionLevel: "Q" },
    imageOptions: { hideBackgroundDots: true, imageSize: 0.4, margin: 5, crossOrigin: "anonymous" },
    dotsOptions: { color: "#000000", type: "square" },
    backgroundOptions: { color: "#ffffff" },
    cornersSquareOptions: { color: "#000000", type: "square" },
    cornersDotOptions: { color: "#000000", type: "square" }
};

const qrCode = new QRCodeStyling(qrConfig);
const previewContainer = document.getElementById('qr-preview');
qrCode.append(previewContainer);

let updateTimer = null;
function updateQR(immediate = false) {
    if (updateTimer) clearTimeout(updateTimer);
    if (immediate) { qrCode.update(qrConfig); return; }
    updateTimer = setTimeout(() => qrCode.update(qrConfig), 60);
}

/* =============================================================
   CONFIGURACIÓN DE TIPOS DE CONTENIDO
============================================================= */
const tabConfigs = {
    url: {
        placeholder: 'Pon tu enlace aquí',
        defaultValue: 'https://www.qrcode-monkey.com',
        inputType: 'url',
        help: 'Introduce una dirección web completa (incluye https://).',
        build: (v) => v.trim() || ' '
    },
    imagen: {
        placeholder: 'URL de la imagen (jpg, png...)',
        defaultValue: 'https://picsum.photos/500',
        inputType: 'url',
        help: 'Se abrirá la imagen al escanear el QR.',
        build: (v) => v.trim() || ' '
    },
    texto: {
        placeholder: 'Escribe aquí tu texto...',
        defaultValue: 'Hola, mundo!',
        inputType: 'text',
        help: 'Texto plano que se mostrará al escanear.',
        build: (v) => v || ' '
    },
    pdf: {
        placeholder: 'URL del PDF',
        defaultValue: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf',
        inputType: 'url',
        help: 'Se abrirá el PDF al escanear el QR.',
        build: (v) => v.trim() || ' '
    },
    mapa: {
        placeholder: 'Dirección o URL de Google Maps',
        defaultValue: 'Av. Reforma 222, CDMX',
        inputType: 'text',
        help: 'Se abrirá la ubicación en el mapa.',
        build: (v) => {
            const val = v.trim();
            if (!val) return ' ';
            if (/^https?:\/\//i.test(val)) return val;
            return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(val)}`;
        }
    },
    whatsapp: {
        placeholder: 'Número de WhatsApp (ej: +521234567890)',
        defaultValue: '+521234567890',
        inputType: 'tel',
        help: 'Abre un chat directo de WhatsApp.',
        build: (v) => {
            const num = v.replace(/[^\d]/g, '');
            return num ? `https://wa.me/${num}` : ' ';
        }
    },
    instagram: {
        placeholder: 'Usuario de Instagram (sin @)',
        defaultValue: 'instagram',
        inputType: 'text',
        help: 'Abre el perfil de Instagram.',
        build: (v) => {
            const user = v.trim().replace(/^@/, '');
            return user ? `https://instagram.com/${user}` : ' ';
        }
    },
    youtube: {
        placeholder: 'URL del video o canal',
        defaultValue: 'https://www.youtube.com',
        inputType: 'url',
        help: 'Abre el enlace de YouTube.',
        build: (v) => v.trim() || ' '
    },
    forms: {
        placeholder: 'URL del Formulario de Google',
        defaultValue: 'https://forms.gle/',
        inputType: 'url',
        help: 'Abre el formulario de Google.',
        build: (v) => v.trim() || ' '
    },
    email: {
        placeholder: 'correo@ejemplo.com',
        defaultValue: 'contacto@amg.com',
        inputType: 'email',
        help: 'Al escanear se abrirá el cliente de correo.',
        build: (v) => { const c = v.trim(); return c ? `mailto:${c}` : ' '; }
    },
    telefono: {
        placeholder: '+52 123 456 7890',
        defaultValue: '+52 555 123 4567',
        inputType: 'tel',
        help: 'Al escanear se iniciará una llamada.',
        build: (v) => { const c = v.replace(/[^\d+]/g, ''); return c ? `tel:${c}` : ' '; }
    },
    sms: {
        placeholder: '+52 123 456 7890',
        defaultValue: '+52 555 123 4567',
        inputType: 'tel',
        help: 'Al escanear se abrirá la app de mensajes.',
        build: (v) => { const c = v.replace(/[^\d+]/g, ''); return c ? `sms:${c}` : ' '; }
    },
    vcard: {
        placeholder: 'Nombre, Teléfono, Email',
        defaultValue: 'Juan Pérez, +521234567890, juan@email.com',
        inputType: 'text',
        help: 'Genera una tarjeta de contacto (vCard).',
        build: (v) => {
            if (!v.trim()) return ' ';
            const [nombre = '', tel = '', email = ''] = v.split(',').map(s => s.trim());
            return `BEGIN:VCARD\nVERSION:3.0\nN:${nombre}\nFN:${nombre}\nTEL:${tel}\nEMAIL:${email}\nEND:VCARD`;
        }
    }
};

let currentTab = 'url';
const pills = document.querySelectorAll('.pill');
const inputHelp = document.getElementById('input-help');
const qrDataInput = document.getElementById('qr-data');

function buildQRData() {
    return tabConfigs[currentTab].build(qrDataInput.value);
}

function setActiveTab(tabKey) {
    if (!tabConfigs[tabKey]) return;
    currentTab = tabKey;
    const cfg = tabConfigs[tabKey];

    pills.forEach(p => p.classList.toggle('active', p.dataset.tab === tabKey));

    inputHelp.textContent = cfg.help || '';
    qrDataInput.type = cfg.inputType;
    qrDataInput.placeholder = cfg.placeholder;
    qrDataInput.value = cfg.defaultValue;

    qrConfig.data = buildQRData();
    updateQR(true);
}

pills.forEach(pill => {
    pill.addEventListener('click', (e) => {
        e.preventDefault();
        setActiveTab(pill.dataset.tab);
    });
});

qrDataInput.addEventListener('input', () => {
    qrConfig.data = buildQRData();
    updateQR();
});

/* =============================================================
   STEP TABS (Contenido / Personalizar)
============================================================= */
const stepTabs = document.querySelectorAll('.step-tab');
const panelContent = document.getElementById('panel-content');
const panelCustomize = document.getElementById('panel-customize');

stepTabs.forEach(tab => {
    tab.addEventListener('click', () => {
        const step = tab.dataset.step;
        stepTabs.forEach(t => t.classList.toggle('active', t === tab));

        if (step === 'content') {
            panelContent.classList.remove('hidden');
            panelCustomize.classList.add('hidden');
        } else {
            panelContent.classList.add('hidden');
            panelCustomize.classList.remove('hidden');
        }
    });
});

/* =============================================================
   COLORES
============================================================= */
const colorTypeRadios = document.querySelectorAll('input[name="color-type"]');
const customEyeFrameCheck = document.getElementById('custom-eye-frame-check');
const customEyeDotCheck = document.getElementById('custom-eye-dot-check');
const transparentBgCheck = document.getElementById('transparent-bg-check');

const gradientContainer = document.getElementById('gradient-color-container');
const eyeFrameColorContainer = document.getElementById('eye-frame-color-container');
const eyeDotColorContainer = document.getElementById('eye-dot-color-container');
const bgColorWrapper = document.getElementById('bg-color-wrapper');

const colorFront1 = document.getElementById('color-front-1');
const hexFront1 = document.getElementById('hex-front-1');
const colorFront2 = document.getElementById('color-front-2');
const hexFront2 = document.getElementById('hex-front-2');
const colorEyeFrame = document.getElementById('color-eye-frame');
const hexEyeFrame = document.getElementById('hex-eye-frame');
const colorEyeDot = document.getElementById('color-eye-dot');
const hexEyeDot = document.getElementById('hex-eye-dot');
const colorBg = document.getElementById('color-bg');
const hexBg = document.getElementById('hex-bg');

function syncColorInputs(colorInput, textInput, callback) {
    colorInput.addEventListener('input', (e) => {
        textInput.value = e.target.value.toUpperCase();
        callback();
    });
    textInput.addEventListener('input', (e) => {
        let val = e.target.value.trim();
        if (!val.startsWith('#')) val = '#' + val;
        if (val.length === 4 || val.length === 7) {
            const test = /^#([0-9A-F]{3}|[0-9A-F]{6})$/i;
            if (test.test(val)) {
                colorInput.value = val;
                callback();
            }
        }
    });
    textInput.addEventListener('blur', () => {
        textInput.value = colorInput.value.toUpperCase();
    });
}

function applyColors() {
    const isGradient = document.querySelector('input[name="color-type"]:checked').value === 'gradient';
    const hasCustomEyeFrame = customEyeFrameCheck.checked;
    const hasCustomEyeDot = customEyeDotCheck.checked;
    const isTransparent = transparentBgCheck.checked;

    const color1 = colorFront1.value;
    const color2 = colorFront2.value;

    qrConfig.backgroundOptions.color = isTransparent ? "rgba(0,0,0,0)" : colorBg.value;

    if (isGradient) {
        qrConfig.dotsOptions.color = color1;
        qrConfig.dotsOptions.gradient = {
            type: 'linear',
            rotation: Math.PI / 4,
            colorStops: [
                { offset: 0, color: color1 },
                { offset: 1, color: color2 }
            ]
        };
    } else {
        qrConfig.dotsOptions.gradient = undefined;
        qrConfig.dotsOptions.color = color1;
    }

    qrConfig.cornersSquareOptions.color = hasCustomEyeFrame ? colorEyeFrame.value : color1;
    qrConfig.cornersDotOptions.color = hasCustomEyeDot ? colorEyeDot.value : color1;

    updateQR();
}

syncColorInputs(colorFront1, hexFront1, applyColors);
syncColorInputs(colorFront2, hexFront2, applyColors);
syncColorInputs(colorEyeFrame, hexEyeFrame, applyColors);
syncColorInputs(colorEyeDot, hexEyeDot, applyColors);
syncColorInputs(colorBg, hexBg, applyColors);

colorTypeRadios.forEach(radio => {
    radio.addEventListener('change', () => {
        gradientContainer.classList.toggle('hidden', radio.value !== 'gradient');
        applyColors();
    });
});

customEyeFrameCheck.addEventListener('change', (e) => {
    eyeFrameColorContainer.classList.toggle('hidden', !e.target.checked);
    applyColors();
});
customEyeDotCheck.addEventListener('change', (e) => {
    eyeDotColorContainer.classList.toggle('hidden', !e.target.checked);
    applyColors();
});
transparentBgCheck.addEventListener('change', (e) => {
    bgColorWrapper.style.opacity = e.target.checked ? '0.4' : '1';
    bgColorWrapper.style.pointerEvents = e.target.checked ? 'none' : 'auto';
    applyColors();
});

/* =============================================================
   LOGO
============================================================= */
const logoUpload = document.getElementById('logo-upload');
const logoPreview = document.getElementById('logo-preview');
const removeLogoBtn = document.getElementById('remove-logo');
const uploadBtn = document.getElementById('upload-btn');

uploadBtn.addEventListener('click', () => logoUpload.click());

logoUpload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
        qrConfig.image = event.target.result;
        logoPreview.innerHTML = `<img src="${event.target.result}" style="width:100%;height:100%;object-fit:contain;">`;
        removeLogoBtn.classList.remove('hidden');
        updateQR(true);
    };
    reader.readAsDataURL(file);
});

removeLogoBtn.addEventListener('click', () => {
    qrConfig.image = "";
    logoPreview.innerHTML = "SIN LOGO";
    logoUpload.value = "";
    removeLogoBtn.classList.add('hidden');
    updateQR(true);
});

/* =============================================================
   FORMAS
============================================================= */
document.querySelectorAll('.shape-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const type = btn.getAttribute('data-type');
        const value = btn.getAttribute('data-value');

        const group = btn.parentElement;
        group.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        if (!qrConfig[type]) {
            console.warn(`qrConfig["${type}"] no existe.`);
            return;
        }
        qrConfig[type].type = value;
        updateQR(true);
    });
});

/* =============================================================
   MARGEN Y CORRECCIÓN
============================================================= */
const marginSlider = document.getElementById('qr-margin');
const marginValue = document.getElementById('margin-value');
marginSlider.addEventListener('input', (e) => {
    qrConfig.margin = parseInt(e.target.value, 10);
    marginValue.textContent = e.target.value;
    updateQR();
});

const errorCorrectionSelect = document.getElementById('error-correction');
errorCorrectionSelect.addEventListener('change', (e) => {
    qrConfig.qrOptions.errorCorrectionLevel = e.target.value;
    updateQR(true);
});

/* =============================================================
   DESCARGAS
============================================================= */
document.getElementById('download-png').addEventListener('click', () => qrCode.download({ name: "qr-amg", extension: "png" }));
document.getElementById('download-svg').addEventListener('click', () => qrCode.download({ name: "qr-amg", extension: "svg" }));

/* =============================================================
   INICIALIZACIÓN
============================================================= */
setActiveTab('url');
</script>
</body>
</html>
